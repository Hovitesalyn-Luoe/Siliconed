# The pure unit tests: no weights are downloaded and nothing touches the GPU.
# A version is tagged only on a commit this run found green.
name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  swift-test:
    # Xcode 26 or later: the app uses macOS 26 APIs behind `#available`, which an older SDK does not declare.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The runner is not an M1 Pro: fewer performance cores, less memory, no AMX exposed. A test that
      # depends on the machine shows it here first.
      - name: Machine
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          for k in hw.memsize hw.ncpu hw.perflevel0.physicalcpu hw.perflevel1.physicalcpu \
                   hw.optional.arm.FEAT_SME hw.optional.arm.FEAT_SME2; do
            printf '%s: %s\n' "$k" "$(sysctl -n "$k" 2>/dev/null || echo absent)"
          done
      - name: Swift version
        run: swift --version
      - name: swift test
        run: swift test

  # The kernels' half of VERIFY.md, as a reader would run it: the reference's goldens written by
  # torch on the runner's CPU, then `siliconed check kernels` judged against them. No model weights.
  # The runner's GPU is virtual: a GPU stage that finds no Metal device says so and is skipped (exit 2).
  kernels:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/oracle/requirements.txt
      - name: Oracle
        run: |
          python -m venv oracle-env
          oracle-env/bin/pip install -r tools/oracle/requirements.txt
          oracle-env/bin/python tools/oracle/kernels.py all
      - name: Build
        run: swift build -c release --product siliconed
      - name: siliconed check kernels
        run: |
          status=0
          .build/release/siliconed check kernels || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]
