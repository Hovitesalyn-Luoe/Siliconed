# The kernels' half of docs/VERIFY.md, as a reader would run it: the reference's goldens written by torch on
# the runner's CPU, then `siliconed check kernels` judged against them. No model weights.
# Installing torch takes minutes, so it runs only when what it checks changes, or on demand.
# The runner's GPU is virtual: a GPU stage that finds no Metal device says so and is skipped (exit 2).
name: kernels

on:
  push:
    branches: [main]
    paths:
      - 'Sources/Siliconed/**'
      - 'Sources/Verification/**'
      - 'Sources/SiliconedCommand/**'
      - 'tools/oracle/**'
      - 'Package.swift'
      - '.github/workflows/kernels.yml'
  workflow_dispatch:

jobs:
  kernels:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/oracle/requirements.txt
      - name: Oracle
        run: |
          python -m venv oracle-env
          oracle-env/bin/pip install -r tools/oracle/requirements.txt
          oracle-env/bin/python tools/oracle/kernels.py all
      - name: Build
        run: swift build -c release --product siliconed
      - name: siliconed check kernels
        run: |
          status=0
          .build/release/siliconed check kernels || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]
